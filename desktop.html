<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QC Mass Production Inspection Report</title>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f3f3;
    color: #222;
    font-family: Arial, sans-serif;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 14px 20px;
}

.topbar h1 {
    margin: 0 0 10px 0;
    font-size: 22px;
}

.toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    background: #333;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

button.green {
    background: #287d32;
}

button.blue {
    background: #2869a8;
}

button.red {
    background: #a52c2c;
}

button.gray {
    background: #666;
}

.status {
    margin-left: auto;
    align-self: center;
    color: #666;
    font-size: 13px;
}

#app {
    max-width: 1250px;
    margin: 20px auto;
    padding: 0 15px 50px;
}

.order {
    background: white;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    margin-bottom: 20px;
    padding: 18px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding-bottom: 12px;
    margin-bottom: 15px;
}

.order-header h2 {
    margin: 0;
    font-size: 19px;
}

.fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 18px;
}

.field label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
}

input[type="text"],
textarea {
    width: 100%;
    border: 1px solid #bbb;
    border-radius: 6px;
    padding: 9px;
    font-family: Arial, sans-serif;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.section {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 15px;
    background: #fafafa;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.section-header h3 {
    margin: 0;
    font-size: 20px;
}

.section-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.drop-zone {
    border: 2px dashed #aaa;
    border-radius: 8px;
    background: white;
    padding: 18px;
    text-align: center;
    margin-top: 10px;
    transition: 0.15s;
}

.drop-zone.dragover {
    border-color: #287dbe;
    background: #edf7ff;
}

.drop-zone input[type="file"] {
    margin-bottom: 8px;
}

.hint {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
    line-height: 1.5;
}

.thumb-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
}

.thumb {
    width: 150px;
    height: 110px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 5px;
    position: relative;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.remove-small {
    position: absolute;
    right: 3px;
    top: 3px;
    padding: 2px 6px;
    font-size: 11px;
    background: #a52c2c;
}

/* Package */

.package-row {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 10px;
    margin-top: 10px;
}

.package-row-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.package-slots {
    display: grid;
    grid-template-columns: 1fr 38px 1fr 38px 1fr 38px 1fr;
    align-items: center;
    gap: 5px;
}

.package-slot {
    height: 105px;
    border: 1px dashed #bbb;
    border-radius: 5px;
    background: #fafafa;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.package-slot img {
    max-width: 100%;
    max-height: 95px;
    object-fit: contain;
}

.package-slot .remove {
    position: absolute;
    right: 2px;
    top: 2px;
    padding: 1px 5px;
    font-size: 10px;
    background: #a52c2c;
}

.package-arrow {
    text-align: center;
    font-size: 25px;
}

/* Product */

.product-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.product-item {
    position: relative;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    padding: 6px;
    min-height: 190px;
}

.product-item img {
    width: 100%;
    height: 175px;
    object-fit: contain;
}

.product-item button {
    position: absolute;
    top: 4px;
    right: 4px;
    padding: 2px 6px;
    font-size: 11px;
    background: #a52c2c;
}

/* Defect */

.defect-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.defect-item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 7px;
    position: relative;
}

.defect-item img {
    width: 100%;
    height: 190px;
    object-fit: contain;
    display: block;
}

.defect-item .remove {
    position: absolute;
    right: 4px;
    top: 4px;
    padding: 2px 6px;
    font-size: 11px;
    background: #a52c2c;
}

.defect-item textarea {
    margin-top: 8px;
    color: red;
    font-size: 18px;
    min-height: 90px;
}

@media(max-width: 850px) {

    .fields {
        grid-template-columns: 1fr;
    }

    .product-list,
    .defect-list {
        grid-template-columns: 1fr;
    }

    .package-slots {
        grid-template-columns: 1fr;
    }

    .package-arrow {
        transform: rotate(90deg);
    }

    .status {
        width: 100%;
        margin-left: 0;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <h1>
        Mass Production Inspection Report Generator
    </h1>

    <div class="toolbar">

        <button
            class="green"
            onclick="addOrder()"
        >
            ＋ 新增订单
        </button>

        <button
            class="blue"
            onclick="exportPPT()"
        >
            导出 PowerPoint
        </button>

        <span
            class="status"
            id="status"
        >
            准备就绪
        </span>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   基础设置
========================================================= */

const CM_TO_INCH = 1 / 2.54;

let orderCounter = 0;

const orders = [];


/* =========================================================
   创建订单
========================================================= */

function createOrder() {

    orderCounter++;

    return {

        id: orderCounter,

        style: "",

        orderNo: "",

        summaryText: "",

        summaryImages: [],

        packageRows: [
            []
        ],

        productImages: [],

        defects: []

    };
}


/* =========================================================
   新增订单
========================================================= */

function addOrder() {

    const order = createOrder();

    orders.push(order);

    renderOrder(order);

    document.getElementById(
        "status"
    ).textContent =
        `目前 ${orders.length} 个订单`;

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });
}


/* =========================================================
   获取订单
========================================================= */

function getOrder(id) {

    return orders.find(
        o => o.id === id
    );

}


/* =========================================================
   删除订单
========================================================= */

function deleteOrder(id) {

    const index =
        orders.findIndex(
            o => o.id === id
        );

    if (index === -1) return;

    if (
        !confirm(
            "确定删除这个订单吗？"
        )
    ) {
        return;
    }

    orders.splice(
        index,
        1
    );

    const element =
        document.getElementById(
            `order-${id}`
        );

    if (element) {
        element.remove();
    }

    document.getElementById(
        "status"
    ).textContent =
        `目前 ${orders.length} 个订单`;

}


/* =========================================================
   渲染订单
========================================================= */

function renderOrder(order) {

    const container =
        document.getElementById(
            "app"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "order";

    wrapper.id =
        `order-${order.id}`;


    wrapper.innerHTML = `

        <div class="order-header">

            <h2>
                订单 ${order.id}
            </h2>

            <button
                class="red"
                onclick="
                    deleteOrder(${order.id})
                "
            >
                删除订单
            </button>

        </div>


        <div class="fields">

            <div class="field">

                <label>
                    款式号
                </label>

                <input
                    type="text"
                    placeholder="请输入款式号"
                    oninput="
                        getOrder(${order.id}).style = this.value
                    "
                >

            </div>


            <div class="field">

                <label>
                    订单号
                </label>

                <input
                    type="text"
                    placeholder="请输入订单号"
                    oninput="
                        getOrder(${order.id}).orderNo = this.value
                    "
                >

            </div>

        </div>


        <!-- SUMMARY -->

        <div class="section">

            <div class="section-header">

                <h3>
                    ① Summary
                </h3>

            </div>


            <label>
                Summary 内容
            </label>

            <textarea
                placeholder="请输入 Summary 内容"
                oninput="
                    getOrder(${order.id}).summaryText = this.value
                "
            ></textarea>


            <div
                class="drop-zone"
                id="summary-drop-${order.id}"
            >

                <input
                    type="file"
                    accept="image/*"
                    multiple
                    onchange="
                        handleSummaryFiles(
                            ${order.id},
                            this.files
                        )
                    "
                >

                <div>
                    也可以直接把图片拖到这里
                </div>

            </div>


            <div
                class="thumb-list"
                id="summary-list-${order.id}"
            ></div>


            <div class="hint">

                PPT 中每个 Summary 页面放 2 张图片。
                图片高度 12 cm，宽度按原始比例自动计算。

            </div>

        </div>


        <!-- PACKAGE -->

        <div class="section">

            <div class="section-header">

                <h3>
                    ② Package
                </h3>


                <div class="section-buttons">

                    <button
                        class="gray"
                        onclick="
                            addPackageRow(
                                ${order.id}
                            )
                        "
                    >
                        ＋ 新增行
                    </button>


                    <button
                        class="gray"
                        onclick="
                            addPackagePage(
                                ${order.id}
                            )
                        "
                    >
                        ＋ 新增页
                    </button>

                </div>

            </div>


            <div
                id="package-${order.id}"
            ></div>

        </div>


        <!-- PRODUCT PHOTO -->

        <div class="section">

            <div class="section-header">

                <h3>
                    ③ Product Photo
                </h3>


                <div class="section-buttons">

                    <button
                        class="gray"
                        onclick="
                            addProductPage(
                                ${order.id}
                            )
                        "
                    >
                        ＋ 新增页面
                    </button>

                </div>

            </div>


            <div
                class="drop-zone"
                id="product-drop-${order.id}"
            >

                <input
                    type="file"
                    accept="image/*"
                    multiple
                    onchange="
                        handleProductFiles(
                            ${order.id},
                            this.files
                        )
                    "
                >

                <div>
                    选择文件，或者直接拖入产品图片
                </div>

            </div>


            <div
                class="product-list"
                id="product-${order.id}"
            ></div>


            <div class="hint">

                PPT 中每页 6 张图片。
                图片高度 8 cm，宽度按原比例自动计算。

            </div>

        </div>


        <!-- DEFECT -->

        <div class="section">

            <div class="section-header">

                <h3>
                    ④ Defect / Problem
                </h3>


                <div class="section-buttons">

                    <button
                        class="gray"
                        onclick="
                            addDefectPage(
                                ${order.id}
                            )
                        "
                    >
                        ＋ 新增页面
                    </button>

                </div>

            </div>


            <div
                class="drop-zone"
                id="defect-drop-${order.id}"
            >

                <input
                    type="file"
                    accept="image/*"
                    multiple
                    onchange="
                        handleDefectFiles(
                            ${order.id},
                            this.files
                        )
                    "
                >

                <div>
                    选择文件，或者直接拖入问题图片
                </div>

            </div>


            <div
                class="defect-list"
                id="defect-${order.id}"
            ></div>


            <div class="hint">

                每一张图片都有一个对应的问题描述框。
                描述字体 Arial 18 pt，红色。

            </div>

        </div>

    `;


    container.appendChild(
        wrapper
    );


    setupDropZone(

        document.getElementById(
            `summary-drop-${order.id}`
        ),

        files =>
            handleSummaryFiles(
                order.id,
                files
            )

    );


    setupDropZone(

        document.getElementById(
            `product-drop-${order.id}`
        ),

        files =>
            handleProductFiles(
                order.id,
                files
            )

    );


    setupDropZone(

        document.getElementById(
            `defect-drop-${order.id}`
        ),

        files =>
            handleDefectFiles(
                order.id,
                files
            )

    );


    renderSummary(
        order.id
    );

    renderPackage(
        order.id
    );

    renderProducts(
        order.id
    );

    renderDefects(
        order.id
    );

}


/* =========================================================
   拖拽
========================================================= */

function setupDropZone(
    element,
    callback
) {

    if (!element) return;


    element.addEventListener(
        "dragover",
        event => {

            event.preventDefault();

            element.classList.add(
                "dragover"
            );

        }
    );


    element.addEventListener(
        "dragleave",
        () => {

            element.classList.remove(
                "dragover"
            );

        }
    );


    element.addEventListener(
        "drop",
        event => {

            event.preventDefault();

            element.classList.remove(
                "dragover"
            );

            callback(
                event.dataTransfer.files
            );

        }
    );

}


/* =========================================================
   读取图片
========================================================= */

function readImage(file) {

    return new Promise(
        (resolve, reject) => {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                reject(
                    new Error(
                        "不是图片文件"
                    )
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload = () => {

                const image =
                    new Image();


                image.onload = () => {

                    const width =
                        image.naturalWidth ||
                        image.width;

                    const height =
                        image.naturalHeight ||
                        image.height;


                    if (
                        !width ||
                        !height ||
                        width <= 0 ||
                        height <= 0
                    ) {

                        reject(
                            new Error(
                                "无法取得图片尺寸"
                            )
                        );

                        return;

                    }


                    resolve({

                        data:
                            reader.result,

                        name:
                            file.name,

                        width:
                            width,

                        height:
                            height

                    });

                };


                image.onerror = () => {

                    reject(
                        new Error(
                            "图片读取失败"
                        )
                    );

                };


                image.src =
                    reader.result;

            };


            reader.onerror = () => {

                reject(
                    new Error(
                        "文件读取失败"
                    )
                );

            };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   SUMMARY
========================================================= */

async function handleSummaryFiles(
    id,
    files
) {

    const order =
        getOrder(id);

    if (!order) return;


    const imageFiles =
        Array.from(files).filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if (
        !imageFiles.length
    ) return;


    try {

        const images =
            await Promise.all(
                imageFiles.map(
                    readImage
                )
            );


        order.summaryImages.push(
            ...images
        );


        renderSummary(id);

    } catch (error) {

        alert(
            "图片读取失败：" +
            error.message
        );

    }

}


function renderSummary(id) {

    const order =
        getOrder(id);

    const container =
        document.getElementById(
            `summary-list-${id}`
        );


    if (!container) return;


    container.innerHTML = "";


    order.summaryImages.forEach(
        (image, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "thumb";


            item.innerHTML = `

                <img
                    src="${image.data}"
                >

                <button
                    class="remove-small"
                    onclick="
                        removeSummaryImage(
                            ${id},
                            ${index}
                        )
                    "
                >
                    ×
                </button>

            `;


            container.appendChild(
                item
            );

        }
    );

}


function removeSummaryImage(
    id,
    index
) {

    const order =
        getOrder(id);

    order.summaryImages.splice(
        index,
        1
    );

    renderSummary(id);

}


/* =========================================================
   PACKAGE
========================================================= */

function addPackageRow(id) {

    const order =
        getOrder(id);

    order.packageRows.push([]);

    renderPackage(id);

}


function addPackagePage(id) {

    const order =
        getOrder(id);


    /*
       一页最多 4 行
    */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        order.packageRows.push([]);

    }


    renderPackage(id);

}


function removePackageRow(
    id,
    rowIndex
) {

    const order =
        getOrder(id);


    if (
        order.packageRows.length <= 1
    ) {

        order.packageRows[0] = [];

    } else {

        order.packageRows.splice(
            rowIndex,
            1
        );

    }


    renderPackage(id);

}


async function handlePackageFiles(
    id,
    rowIndex,
    files
) {

    const order =
        getOrder(id);

    if (!order) return;


    const imageFiles =
        Array.from(files).filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if (
        !imageFiles.length
    ) return;


    try {

        const images =
            await Promise.all(
                imageFiles.map(
                    readImage
                )
            );


        images.forEach(
            image => {

                let currentRow =
                    order.packageRows[
                        rowIndex
                    ];


                if (
                    currentRow.length < 4
                ) {

                    currentRow.push(
                        image
                    );

                    return;

                }


                let r =
                    rowIndex + 1;


                while (true) {

                    if (
                        !order.packageRows[r]
                    ) {

                        order.packageRows[r] =
                            [];

                    }


                    if (
                        order.packageRows[r]
                            .length < 4
                    ) {

                        order.packageRows[r]
                            .push(image);

                        break;

                    }


                    r++;

                }

            }
        );


        renderPackage(id);

    } catch (error) {

        alert(
            "图片读取失败：" +
            error.message
        );

    }

}


function removePackageImage(
    id,
    rowIndex,
    imageIndex
) {

    const order =
        getOrder(id);

    order.packageRows[
        rowIndex
    ].splice(
        imageIndex,
        1
    );

    renderPackage(id);

}


function createPackageSlot(
    image,
    id,
    rowIndex,
    imageIndex
) {

    if (!image) {

        return `

            <div class="package-slot">

                <span
                    style="
                        color:#aaa;
                        font-size:13px;
                    "
                >
                    第 ${imageIndex + 1} 张
                </span>

            </div>

        `;

    }


    return `

        <div class="package-slot">

            <img
                src="${image.data}"
            >

            <button
                class="remove"
                onclick="
                    removePackageImage(
                        ${id},
                        ${rowIndex},
                        ${imageIndex}
                    )
                "
            >
                ×
            </button>

        </div>

    `;

}


function renderPackage(id) {

    const order =
        getOrder(id);

    const container =
        document.getElementById(
            `package-${id}`
        );


    if (!container) return;


    container.innerHTML = "";


    order.packageRows.forEach(
        (row, rowIndex) => {

            const rowDiv =
                document.createElement(
                    "div"
                );

            rowDiv.className =
                "package-row";


            rowDiv.innerHTML = `

                <div class="package-row-title">

                    第 ${rowIndex + 1} 行

                    <button
                        class="gray"
                        style="
                            float:right;
                            padding:4px 8px;
                        "
                        onclick="
                            removePackageRow(
                                ${id},
                                ${rowIndex}
                            )
                        "
                    >
                        删除行
                    </button>

                </div>


                <div class="package-slots">

                    ${createPackageSlot(
                        row[0],
                        id,
                        rowIndex,
                        0
                    )}

                    <div class="package-arrow">
                        →
                    </div>

                    ${createPackageSlot(
                        row[1],
                        id,
                        rowIndex,
                        1
                    )}

                    <div class="package-arrow">
                        →
                    </div>

                    ${createPackageSlot(
                        row[2],
                        id,
                        rowIndex,
                        2
                    )}

                    <div class="package-arrow">
                        →
                    </div>

                    ${createPackageSlot(
                        row[3],
                        id,
                        rowIndex,
                        3
                    )}

                </div>


                <div
                    class="drop-zone"
                    style="
                        margin-top:8px;
                        padding:10px;
                    "
                >

                    <input
                        type="file"
                        accept="image/*"
                        multiple
                    >

                    <div>
                        选择文件或拖入本行图片
                    </div>

                </div>

            `;


            container.appendChild(
                rowDiv
            );


            const drop =
                rowDiv.querySelector(
                    ".drop-zone"
                );


            const input =
                drop.querySelector(
                    "input"
                );


            input.addEventListener(
                "change",
                event => {

                    handlePackageFiles(
                        id,
                        rowIndex,
                        event.target.files
                    );

                    event.target.value =
                        "";

                }
            );


            setupDropZone(
                drop,
                files => {

                    handlePackageFiles(
                        id,
                        rowIndex,
                        files
                    );

                }
            );

        }
    );

}

========================================================= */

async function handleProductFiles(
    id,
    files
) {

    const order =
        getOrder(id);

    if (!order) return;


    const imageFiles =
        Array.from(files).filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if (
        !imageFiles.length
    ) return;


    try {

        const images =
            await Promise.all(
                imageFiles.map(
                    readImage
                )
            );


        order.productImages.push(
            ...images
        );


        renderProducts(id);

    } catch (error) {

        alert(
            "图片读取失败：" +
            error.message
        );

    }

}


function renderProducts(id) {

    const order =
        getOrder(id);

    const container =
        document.getElementById(
            `product-${id}`
        );


    if (!container) return;


    container.innerHTML = "";


    order.productImages.forEach(
        (image, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "product-item";


            item.innerHTML = `

                <img
                    src="${image.data}"
                >

                <button
                    onclick="
                        removeProductImage(
                            ${id},
                            ${index}
                        )
                    "
                >
                    ×
                </button>

            `;


            container.appendChild(
                item
            );

        }
    );

}


function removeProductImage(
    id,
    index
) {

    const order =
        getOrder(id);

    order.productImages.splice(

        1
    );

    renderProducts(id);

}

/* =========================================================
   PPT 基础函数
========================================================= */

function cm(value) {

    return value *
        CM_TO_INCH;

}


/*
   每页顶部抬头

   ★ 这里已经直接设置：
   align: "center"

   所以抬头会水平居中。
*/

function addPPTHeader(
    slide,
    order
) {

    const title =
        `${order.style.trim()} ` +
        `${order.orderNo.trim()} ` +
        `Mass Production Inspection`;


    slide.addText(

        title,

        {

            x:
                0.35,

            y:
                0.15,

            w:
                12.63,

            h:
                0.4,

            fontFace:
                "Arial",

            fontSize:
                18,

            color:
                "000000",

            margin:
                0,

            breakLine:
                false,

            fit:
                "shrink",

            /*
               ★★★
               抬头水平居中
               ★★★
            */

            align:
                "center"

        }

    );

}


/* =========================================================
   图片：固定高度 + 自动宽度
========================================================= */

function addImageByHeight(
    slide,
    image,
    x,
    y,
    heightCM
) {

    const height =
        cm(heightCM);


    let imageWidth =
        Number(
            image.width
        );


    let imageHeight =
        Number(
            image.height
        );


    if (
        !imageWidth ||
        !imageHeight ||
        imageWidth <= 0 ||
        imageHeight <= 0
    ) {

        imageWidth = 1;

        imageHeight = 1;

    }


    const ratio =
        imageWidth /
        imageHeight;


    let width =
        height *
        ratio;


    if (
        !isFinite(width) ||
        width <= 0
    ) {

        width =
            height;

    }


    slide.addImage({

        data:
            image.data,

        x:
            x,

        y:
            y,

        w:
            width,

        h:
            height

    });


    return {

        width:
            width,

        height:
            height

    };

}


/* =========================================================
   图片：限制区域，保持比例
========================================================= */

function addImageContain(
    slide,
    image,
    x,
    y,
    maxWidth,
    maxHeight
) {

    let iw =
        Number(
            image.width
        );


    let ih =
        Number(
            image.height
        );


    if (
        !iw ||
        !ih ||
        iw <= 0 ||
        ih <= 0
    ) {

        iw = 1;

        ih = 1;

    }


    const scale =
        Math.min(

            maxWidth / iw,

            maxHeight / ih

        );


    let width =
        iw * scale;


    let height =
        ih * scale;


    if (
        !isFinite(width) ||
        width <= 0
    ) {

        width =
            maxWidth;

    }


    if (
        !isFinite(height) ||
        height <= 0
    ) {

        height =
            maxHeight;

    }


    slide.addImage({

        data:
            image.data,

        x:
            x +
            (maxWidth - width) / 2,

        y:
            y +
            (maxHeight - height) / 2,

        w:
            width,

        h:
            height

    });

}

   创建 PPT

function createPPT() {

    const pptx =

    };

}


/* =========================================================
   SUMMARY PPT
========================================================= */

function buildSummarySlides(
    pptx,
    order
) {

    const images =
        order.summaryImages;


    if (
        images.length === 0
    ) {

        const slide =
            pptx.addSlide();


        addPPTHeader(
            slide,
            order
        );


        slide.addText(
            "Summary:",
            {

                x:
                    0.45,

                y:
                    0.75,

                w:
                    12,

                h:
                    0.35,

                fontFace:
                    "Arial",

                fontSize:
                    18,

                margin:
                    0

            }
        );


        slide.addText(
            order.summaryText || "",
            {

                x:
                    0.45,

                y:
                    1.15,

                w:
                    12,

                h:
                    1.2,

                fontFace:
                    "Arial",

                fontSize:
                    18,

                margin:
                    0.02,

                valign:
                    "top"

            }
        );


        return;

    }


    /*
       每 2 张图片一个 Summary 页面
    */

    for (
        let start = 0;

        start < images.length;

        start += 2
    ) {

        const slide =
            pptx.addSlide();


        addPPTHeader(
            slide,
            order
        );


        slide.addText(
            "Summary:",
            {

                x:
                    0.45,

                y:
                    0.72,

                w:
                    12,

                h:
                    0.35,

                fontFace:
                    "Arial",

                fontSize:
                    18,

                margin:
                    0

            }
        );


        slide.addText(
            order.summaryText || "",
            {

                x:
                    0.45,

                y:
                    1.12,

                w:
                    12,

                h:
                    1.05,

                fontFace:
                    "Arial",

                fontSize:
                    18,

                margin:
                    0.02,

                valign:
                    "top",

                fit:
                    "shrink"

            }
        );


        const pageImages =
            images.slice(
                start,
                start + 2
            );


        const areaY =
            2.35;


        const areaH =
            cm(12);


        const areaW =
            5.95;


        pageImages.forEach(
            (
                image,
                index
            ) => {

                addImageContain(

                    slide,

                    image,

                    0.45 +
                    index * 6.2,

                    areaY,

                    areaW,

                    areaH

                );

            }
        );

    }

}


/* =========================================================
   PACKAGE PPT
========================================================= */

function buildPackageSlides(
    pptx,
    order
) {

    const rows =
        order.packageRows;


    for (
        let start = 0;

        start < rows.length;

        start += 4
    ) {

        const slide =
            pptx.addSlide();


        addPPTHeader(
            slide,
            order
        );


        slide.addText(
            "Package",
            {

                x:
                    0.45,

                y:
                    0.72,

                w:
                    12,

                h:
                    0.55,

                fontFace:
                    "Arial",

                fontSize:
                    28,

                margin:
                    0

            }
        );


        const pageRows =
            rows.slice(
                start,
                start + 4
            );


        pageRows.forEach(
            (
                row,
                rowIndex
            ) => {

                const imageHeight =
                    cm(3);


                const slotWidth =
                    2.75;


                const y =
                    1.45 +
                    rowIndex * 1.65;


                for (
                    let i = 0;

                    i < 4;

                    i++
                ) {

                    const image =
                        row[i];


                    const x =
                        0.35 +
                        i * 3.05;


                    if (image) {

                        addImageContain(

                            slide,

                            image,

                            x,

                            y,

                            slotWidth,

                            imageHeight

                        );

                    }


                    if (
                        i < 3
                    ) {

                        slide.addText(
                            "→",
                            {

                                x:
                                    x +
                                    2.77,

                                y:
                                    y +
                                    0.25,

                                w:
                                    0.35,

                                h:
                                    0.35,

                                fontFace:
                                    "Arial",

                                fontSize:
                                    20,

                                margin:
                                    0,

                                align:
                                    "center"

                            }
                        );

                    }

                }

            }
        );

    }

}


/* =========================================================
   PRODUCT PHOTO PPT
========================================================= */

function buildProductSlides(
    pptx,
    order
) {

    const images =
        order.productImages;


    if (
        images.length === 0
    ) {

        return;

    }


    for (
        let start = 0;

        start < images.length;

        start += 6
    ) {

        const slide =
            pptx.addSlide();


        addPPTHeader(
            slide,
            order
        );


        const pageImages =
            images.slice(
                start,
                start + 6
            );


        pageImages.forEach(
            (
                image,
                index
            ) => {

                const col =
                    index % 3;


                const row =
                    Math.floor(
                        index / 3
                    );


                const x =
                    0.35 +
                    col * 4.2;


                const y =
                    0.85 +
                    row * 3.75;


                addImageContain(

                    slide,

                    image,

                    x,

                    y,

                    3.85,

                    cm(8)

                );

            }
        );

    }

}


/* =========================================================
   DEFECT PPT
========================================================= */

function buildDefectSlides(
    pptx,
    order
) {

    const defects =
        order.defects;


    if (
        defects.length === 0
    ) {

        return;

    }


    for (
        let start = 0;

        start < defects.length;

        start += 3
    ) {

        const slide =
            pptx.addSlide();


        addPPTHeader(
            slide,
            order
        );


        const pageDefects =
            defects.slice(
                start,
                start + 3
            );


        pageDefects.forEach(
            (
                defect,
                index
            ) => {

                const x =
                    0.35 +
                    index * 4.2;


                addImageContain(

                    slide,

                    defect.image,

                    x,

                    0.85,

                    3.85,

                    cm(8)

                );


                slide.addText(

                    defect.description ||
                    "",

                    {

                        x:
                            x,

                        y:
                            4.25,

                        w:
                            3.85,

                        h:
                            1.25,

                        fontFace:
                            "Arial",

                        fontSize:
                            18,

                        color:
                            "FF0000",

                        margin:
                            0.04,

                        valign:
                            "top",

                        fit:
                            "shrink"

                    }

                );

            }
        );

    }

}


/* =========================================================
   文件名
========================================================= */

function makeFileName() {

    const names = [];


    orders.forEach(
        order => {

            const style =
                order.style.trim();


            const orderNo =
                order.orderNo.trim();


            if (
                style &&
                orderNo
            ) {

                names.push(
                    `${style} ${orderNo}`
                );

            }

        }
    );


    const uniqueNames =
        [
            ...new Set(names)
        ];


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const date =
        `${year}-${month}-${day}`;


    let base =
        uniqueNames.join(" ");


    if (!base) {

        base =
            "Mass Production Inspection";

    }


    base =
        base.replace(
            /[\\/:*?"<>|]/g,
            "_"
        );


    return (

        `${base} ` +

        `Mass Production Inspection On ` +

        `${date}.pptx`

    );

}


/* =========================================================
   导出 PPT
========================================================= */

async function exportPPT() {

    if (
        typeof PptxGenJS ===
        "undefined"
    ) {

        alert(

            "PPT 生成组件没有成功加载。\n\n" +

            "请确认电脑可以连接网络，" +

            "然后重新打开这个 HTML 文件。"

        );

        return;

    }


    if (
        orders.length === 0
    ) {

        alert(
            "请先新增订单。"
        );

        return;

    }


    /*
       检查每个订单的基本资料
    */

    for (
        const order of orders
    ) {

        if (
            !order.style.trim()
        ) {

            alert(
                `订单 ${order.id} 没有填写款式号。`
            );

            return;

        }


        if (
            !order.orderNo.trim()
        ) {

            alert(
                `订单 ${order.id} 没有填写订单号。`
            );

            return;

        }

    }


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "正在生成 PowerPoint，请稍候…";


    try {

        const pptx =
            createPPT();


        /*
           每个订单依次生成：

           Summary
           Package
           Product Photo
           Defect
        */

        for (
            const order of orders
        ) {

            buildSummarySlides(
                pptx,
                order
            );


            buildPackageSlides(
                pptx,
                order
            );


            buildProductSlides(
                pptx,
                order
            );


            buildDefectSlides(
                pptx,
                order
            );

        }


        const fileName =
            makeFileName();


        await pptx.writeFile({

            fileName:
                fileName

        });


        status.textContent =
            `导出完成：${fileName}`;


        alert(

            "PPT 已经生成完成。\n\n" +

            fileName

        );

    } catch (error) {

        console.error(
            error
        );


        status.textContent =
            "PPT 导出失败";


        alert(

            "PPT 导出失败：\n\n" +

            error.message

        );

    }

}
