<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Stitch Report</title>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

h1 {
    font-size: 26px;
    margin: 0 0 18px;
}

.section {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 14px;
}

.order-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.order-title {
    font-size: 20px;
    font-weight: bold;
}

label.field-label {
    display: block;
    font-weight: bold;
    margin: 12px 0 6px;
}

input[type="text"],
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 10px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 15px;
    margin: 4px;
    font-size: 15px;
    cursor: pointer;
    background: #333;
    color: white;
}

button.danger {
    background: #b3261e;
}

button.green {
    background: #16833b;
}

button.gray {
    background: #777;
}

/* =====================================================
   MOBILE FILE UPLOAD
   ===================================================== */

.upload-box {
    border: 2px dashed #aaa;
    border-radius: 10px;
    background: #fafafa;
    padding: 16px;
    margin-top: 12px;
    text-align: center;
}

.upload-title {
    font-size: 16px;
    margin-bottom: 10px;
}

.file-input {
    width: 100%;
    font-size: 16px;
    padding: 8px;
}

.upload-note {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
}

/* =====================================================
   IMAGE LIST
   ===================================================== */

.image-list {
    margin-top: 12px;
}

.image-item {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
    background: white;
}

.image-item img {
    width: 90px;
    height: 70px;
    object-fit: contain;
    background: #eee;
    border: 1px solid #ddd;
}

.image-info {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    word-break: break-word;
}

.image-info small {
    display: block;
    color: #777;
    margin-top: 4px;
}

/* =====================================================
   PACKAGE
   ===================================================== */

.package-page {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    margin-top: 12px;
}

.package-page-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.package-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.package-slot {
    width: 105px;
    min-width: 105px;
    height: 78px;
    border: 1px dashed #bbb;
    border-radius: 6px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.package-slot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.package-delete {
    position: absolute;
    right: 2px;
    top: 2px;
    margin: 0;
    padding: 2px 6px;
    font-size: 12px;
    background: #b3261e;
}

.package-arrow {
    width: 25px;
    min-width: 25px;
    text-align: center;
    font-size: 22px;
}

/* =====================================================
   PRODUCT
   ===================================================== */

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 14px;
}

.product-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
}

.product-item img {
    width: 100%;
    height: 190px;
    object-fit: contain;
    background: #eee;
}

.product-number {
    font-size: 13px;
    margin-top: 5px;
}

/* =====================================================
   DEFECT
   ===================================================== */

.defect-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 14px;
}

.defect-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
}

.defect-item img {
    width: 100%;
    height: 240px;
    object-fit: contain;
    background: #eee;
}

.defect-item textarea {
    margin-top: 8px;
    color: red;
}

/* =====================================================
   EXPORT
   ===================================================== */

.export-area {
    position: sticky;
    bottom: 0;
    z-index: 100;
    background: rgba(245,245,245,.96);
    padding: 10px 0;
    text-align: center;
}

.export-button {
    background: #16833b;
    font-size: 18px;
    padding: 13px 25px;
}

.status {
    white-space: pre-wrap;
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    color: #555;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    h1 {
        font-size: 22px;
    }

    .section,
    .order-card {
        padding: 12px;
    }

    .section-title {
        font-size: 20px;
    }

    .product-grid {
        grid-template-columns: 1fr;
    }

    .defect-grid {
        grid-template-columns: 1fr;
    }

    .product-item img {
        height: auto;
        max-height: 300px;
    }

    .defect-item img {
        height: auto;
        max-height: 320px;
    }

    .image-item img {
        width: 70px;
        height: 60px;
    }

    button {
        font-size: 14px;
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Stitch Report Generator</h1>

<div id="orders"></div>

<div style="text-align:center; margin:15px 0;">
    <button onclick="addOrder()">＋ Add Order</button>
</div>

<div class="export-area">
    <button class="export-button" onclick="exportPPT()">
        Export PPT
    </button>
</div>

<div id="status" class="status">
Ready.
</div>

</div>


<script>

/* =====================================================
   SETTINGS
   ===================================================== */

const IMAGE_MAX_SIDE = 2000;
const IMAGE_START_QUALITY = 0.82;
const IMAGE_MIN_QUALITY = 0.55;
const IMAGE_TARGET_MAX_BYTES = 500 * 1024;

let orders = [];
let orderIdCounter = 1;


/* =====================================================
   BASIC HELPERS
   ===================================================== */

function cm(value) {
    return value / 2.54;
}


function formatBytes(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(2) + " MB";
}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function setStatus(text) {

    document.getElementById("status").textContent = text;
}


/* =====================================================
   READ IMAGE
   ===================================================== */

function readFileAsDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () => reject(
            new Error("无法读取图片")
        );

        reader.readAsDataURL(file);
    });
}


function loadImage(dataURL) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => {

            if (!img.naturalWidth || !img.naturalHeight) {

                reject(
                    new Error("图片尺寸读取失败")
                );

                return;
            }

            resolve(img);
        };

        img.onerror = () => reject(
            new Error("图片加载失败")
        );

        img.src = dataURL;
    });
}


/* =====================================================
   IMAGE COMPRESSION
   ===================================================== */

async function compressImage(file) {

    const originalDataURL =
        await readFileAsDataURL(file);

    const originalImage =
        await loadImage(originalDataURL);

    let width =
        originalImage.naturalWidth;

    let height =
        originalImage.naturalHeight;

    const originalWidth = width;
    const originalHeight = height;

    if (!width || !height) {

        throw new Error(
            "无法取得图片尺寸"
        );
    }

    const maxSide =
        Math.max(width, height);

    if (maxSide > IMAGE_MAX_SIDE) {

        const ratio =
            IMAGE_MAX_SIDE / maxSide;

        width =
            Math.round(width * ratio);

        height =
            Math.round(height * ratio);
    }

    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext("2d");

    /*
       White background prevents transparent
       PNG images from becoming black.
    */

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
    );

    let quality =
        IMAGE_START_QUALITY;

    let dataURL =
        canvas.toDataURL(
            "image/jpeg",
            quality
        );

    /*
       Gradually reduce quality until
       image is approximately below 500 KB.
    */

    while (
        dataURL.length * 0.75 >
        IMAGE_TARGET_MAX_BYTES &&
        quality > IMAGE_MIN_QUALITY
    ) {

        quality -= 0.05;

        dataURL =
            canvas.toDataURL(
                "image/jpeg",
                quality
            );
    }

    /*
       Load the FINAL compressed image again.
       This guarantees correct naturalWidth/
       naturalHeight before PPT export.
    */

    const finalImage =
        await loadImage(dataURL);

    return {

        dataURL: dataURL,

        img: finalImage,

        width: finalImage.naturalWidth,

        height: finalImage.naturalHeight,

        originalWidth: originalWidth,

        originalHeight: originalHeight,

        originalSize: file.size,

        finalSize:
            Math.round(dataURL.length * 0.75)
    };
}


/* =====================================================
   ORDER
   ===================================================== */

function addOrder() {

    const order = {

        id: orderIdCounter++,

        style: "",

        orderNumber: "",

        summary: "",

        summaryImages: [],

        packagePages: [

            {
                rows: [
                    [null, null, null, null]
                ]
            }

        ],

        productImages: [],

        defectItems: []
    };

    orders.push(order);

    renderOrders();
}


function deleteOrder(id) {

    if (orders.length === 1) {

        alert(
            "At least one order is required."
        );

        return;
    }

    orders =
        orders.filter(
            order => order.id !== id
        );

    renderOrders();
}


function updateOrder(
    id,
    field,
    value
) {

    const order =
        orders.find(
            o => o.id === id
        );

    if (order) {
        order[field] = value;
    }
}


/* =====================================================
   RENDER ALL ORDERS
   ===================================================== */

function renderOrders() {

    const container =
        document.getElementById("orders");

    container.innerHTML = "";

    orders.forEach(
        (order, index) => {

            container.appendChild(
                createOrderElement(
                    order,
                    index
                )
            );
        }
    );
}


/* =====================================================
   CREATE ORDER UI
   ===================================================== */

function createOrderElement(
    order,
    index
) {

    const card =
        document.createElement("div");

    card.className =
        "order-card";

    card.innerHTML = `

        <div class="order-header">

            <div class="order-title">
                Order ${index + 1}
            </div>

            <button
                class="danger"
                onclick="deleteOrder(${order.id})">
                Delete
            </button>

        </div>

        <label class="field-label">
            款式号 / Style Number
        </label>

        <input
            type="text"
            value="${escapeHTML(order.style)}"
            placeholder="例如 80769"
            oninput="
                updateOrder(
                    ${order.id},
                    'style',
                    this.value
                )
            "
        >

        <label class="field-label">
            订单号 / Order Number
        </label>

        <input
            type="text"
            value="${escapeHTML(order.orderNumber)}"
            placeholder="例如 C10468981"
            oninput="
                updateOrder(
                    ${order.id},
                    'orderNumber',
                    this.value
                )
            "
        >

        ${summaryHTML(order)}

        ${packageHTML(order)}

        ${productHTML(order)}

        ${defectHTML(order)}
    `;

    /*
       Append first, then bind native file inputs.
    */

    setTimeout(() => {

        initializeOrder(
            order
        );

    }, 0);

    return card;
}


/* =====================================================
   SUMMARY HTML
   ===================================================== */

function summaryHTML(order) {

    return `

    <div class="section">

        <div class="section-title">
            Summary
        </div>

        <label class="field-label">
            Summary Content
        </label>

        <textarea
            placeholder="Enter summary"
            oninput="
                updateOrder(
                    ${order.id},
                    'summary',
                    this.value
                )
            "
        >${escapeHTML(order.summary)}</textarea>

        <div class="upload-box">

            <div class="upload-title">
                选择 Summary 图片
            </div>

            <input
                class="file-input"
                id="summary-input-${order.id}"
                type="file"
                accept="image/*"
                multiple
            >

            <div class="upload-note">
                iPhone 可直接选择照片、拍照或文件
            </div>

        </div>

        <div
            class="image-list"
            id="summary-list-${order.id}">
        </div>

        <div class="upload-note">
            图片会在手机本地自动压缩，原始照片不会被修改。
        </div>

    </div>

    `;
}


/* =====================================================
   SUMMARY EVENTS
   ===================================================== */

function initializeSummary(order) {

    const input =
        document.getElementById(
            `summary-input-${order.id}`
        );

    if (!input) return;

    input.addEventListener(
        "change",
        async function() {

            const files =
                Array.from(this.files || []);

            if (!files.length) return;

            await handleSummaryFiles(
                order,
                files
            );

            this.value = "";
        }
    );

    renderSummary(order);
}


async function handleSummaryFiles(
    order,
    files
) {

    setStatus(
        "正在处理 Summary 图片..."
    );

    for (const file of files) {

        try {

            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image =
                await compressImage(file);

            order.summaryImages.push(
                image
            );

        } catch (error) {

            console.error(error);

            alert(
                "图片处理失败：\n" +
                file.name +
                "\n\n" +
                error.message
            );
        }
    }

    renderSummary(order);

    setStatus(
        "Summary 图片处理完成。"
    );
}


function renderSummary(order) {

    const list =
        document.getElementById(
            `summary-list-${order.id}`
        );

    if (!list) return;

    list.innerHTML = "";

    order.summaryImages.forEach(
        (image, index) => {

            const item =
                document.createElement("div");

            item.className =
                "image-item";

            item.innerHTML = `

                <img
                    src="${image.dataURL}"
                    alt="Summary">

                <div class="image-info">

                    Image ${index + 1}

                    <small>
                        ${image.width} × ${image.height}px
                        · ${formatBytes(image.finalSize)}
                    </small>

                </div>

                <button
                    class="danger"
                    onclick="
                        removeSummaryImage(
                            ${order.id},
                            ${index}
                        )
                    ">
                    Delete
                </button>
            `;

            list.appendChild(item);
        }
    );
}


function removeSummaryImage(
    orderId,
    index
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.summaryImages.splice(
        index,
        1
    );

    renderSummary(order);
}


/* =====================================================
   PACKAGE HTML
   ===================================================== */

function packageHTML(order) {

    return `

    <div class="section">

        <div class="section-title">
            Package
        </div>

        <div class="upload-box">

            <div class="upload-title">
                选择 Package 图片
            </div>

            <input
                class="file-input"
                id="package-input-${order.id}"
                type="file"
                accept="image/*"
                multiple
            >

            <div class="upload-note">
                图片会按照选择顺序依次放入 Package
            </div>

        </div>

        <div
            id="package-pages-${order.id}">
        </div>

        <button
            onclick="
                addPackagePage(
                    ${order.id}
                )
            ">
            ＋ Add Package Page
        </button>

    </div>

    `;
}


/* =====================================================
   PACKAGE EVENTS
   ===================================================== */

function initializePackage(order) {

    const input =
        document.getElementById(
            `package-input-${order.id}`
        );

    if (!input) return;

    input.addEventListener(
        "change",
        async function() {

            const files =
                Array.from(this.files || []);

            if (!files.length) return;

            await handlePackageFiles(
                order,
                files
            );

            this.value = "";
        }
    );

    renderPackage(order);
}


async function handlePackageFiles(
    order,
    files
) {

    setStatus(
        "正在处理 Package 图片..."
    );

    for (const file of files) {

        try {

            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image =
                await compressImage(file);

            let placed = false;

            for (
                const page
                of order.packagePages
            ) {

                for (
                    const row
                    of page.rows
                ) {

                    for (
                        let i = 0;
                        i < 4;
                        i++
                    ) {

                        if (!row[i]) {

                            row[i] =
                                image;

                            placed = true;

                            break;
                        }
                    }

                    if (placed) break;
                }

                if (placed) break;
            }

            if (!placed) {

                order.packagePages.push({

                    rows: [
                        [
                            image,
                            null,
                            null,
                            null
                        ]
                    ]

                });
            }

        } catch (error) {

            console.error(error);

            alert(
                "图片处理失败：\n" +
                file.name
            );
        }
    }

    renderPackage(order);

    setStatus(
        "Package 图片处理完成。"
    );
}


function renderPackage(order) {

    const container =
        document.getElementById(
            `package-pages-${order.id}`
        );

    if (!container) return;

    container.innerHTML = "";

    order.packagePages.forEach(
        (page, pageIndex) => {

            const pageDiv =
                document.createElement("div");

            pageDiv.className =
                "package-page";

            pageDiv.innerHTML = `
                <div class="package-page-title">
                    Package Page ${pageIndex + 1}
                </div>
            `;

            page.rows.forEach(
                (row, rowIndex) => {

                    const rowDiv =
                        document.createElement("div");

                    rowDiv.className =
                        "package-row";

                    for (
                        let i = 0;
                        i < 4;
                        i++
                    ) {

                        const slot =
                            document.createElement("div");

                        slot.className =
                            "package-slot";

                        if (row[i]) {

                            slot.innerHTML = `

                                <img
                                    src="${row[i].dataURL}"
                                    alt="Package">

                                <button
                                    class="package-delete"
                                    onclick="
                                        removePackageImage(
                                            ${order.id},
                                            ${pageIndex},
                                            ${rowIndex},
                                            ${i}
                                        )
                                    ">
                                    ×
                                </button>
                            `;
                        }

                        rowDiv.appendChild(slot);

                        if (i < 3) {

                            const arrow =
                                document.createElement("div");

                            arrow.className =
                                "package-arrow";

                            arrow.textContent =
                                "→";

                            rowDiv.appendChild(
                                arrow
                            );
                        }
                    }

                    pageDiv.appendChild(
                        rowDiv
                    );
                }
            );

            const addRowButton =
                document.createElement("button");

            addRowButton.textContent =
                "＋ Add Row";

            addRowButton.onclick =
                function() {

                    addPackageRow(
                        order.id,
                        pageIndex
                    );
                };

            pageDiv.appendChild(
                addRowButton
            );

            container.appendChild(
                pageDiv
            );
        }
    );
}


function addPackageRow(
    orderId,
    pageIndex
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.packagePages[
        pageIndex
    ].rows.push(
        [null, null, null, null]
    );

    renderPackage(order);
}


function addPackagePage(orderId) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.packagePages.push({

        rows: [
            [null, null, null, null]
        ]

    });

    renderPackage(order);
}


function removePackageImage(
    orderId,
    pageIndex,
    rowIndex,
    slotIndex
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.packagePages[
        pageIndex
    ].rows[
        rowIndex
    ][slotIndex] = null;

    renderPackage(order);
}


/* =====================================================
   PRODUCT HTML
   ===================================================== */

function productHTML(order) {

    return `

    <div class="section">

        <div class="section-title">
            Product Photo
        </div>

        <div class="upload-box">

            <div class="upload-title">
                选择 Product Photo
            </div>

            <input
                class="file-input"
                id="product-input-${order.id}"
                type="file"
                accept="image/*"
                multiple
            >

            <div class="upload-note">
                每页最多 6 张
            </div>

        </div>

        <div
            class="product-grid"
            id="product-grid-${order.id}">
        </div>

    </div>

    `;
}


function initializeProduct(order) {

    const input =
        document.getElementById(
            `product-input-${order.id}`
        );

    if (!input) return;

    input.addEventListener(
        "change",
        async function() {

            const files =
                Array.from(this.files || []);

            if (!files.length) return;

            await handleProductFiles(
                order,
                files
            );

            this.value = "";
        }
    );

    renderProducts(order);
}


async function handleProductFiles(
    order,
    files
) {

    setStatus(
        "正在处理 Product Photo..."
    );

    for (const file of files) {

        try {

            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image =
                await compressImage(file);

            order.productImages.push(
                image
            );

        } catch (error) {

            console.error(error);

            alert(
                "图片处理失败：\n" +
                file.name
            );
        }
    }

    renderProducts(order);

    setStatus(
        "Product Photo 处理完成。"
    );
}


function renderProducts(order) {

    const grid =
        document.getElementById(
            `product-grid-${order.id}`
        );

    if (!grid) return;

    grid.innerHTML = "";

    order.productImages.forEach(
        (image, index) => {

            const item =
                document.createElement("div");

            item.className =
                "product-item";

            item.innerHTML = `

                <img
                    src="${image.dataURL}"
                    alt="Product">

                <div class="product-number">
                    Product ${index + 1}
                    · ${image.width} × ${image.height}px
                </div>

                <button
                    class="danger"
                    onclick="
                        removeProductImage(
                            ${order.id},
                            ${index}
                        )
                    ">
                    Delete
                </button>
            `;

            grid.appendChild(item);
        }
    );
}


function removeProductImage(
    orderId,
    index
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.productImages.splice(
        index,
        1
    );

    renderProducts(order);
}


/* =====================================================
   DEFECT HTML
   ===================================================== */

function defectHTML(order) {

    return `

    <div class="section">

        <div class="section-title">
            Defect
        </div>

        <div class="upload-box">

            <div class="upload-title">
                选择 Defect 图片
            </div>

            <input
                class="file-input"
                id="defect-input-${order.id}"
                type="file"
                accept="image/*"
                multiple
            >

            <div class="upload-note">
                每张图片对应一个问题描述
            </div>

        </div>

        <div
            class="defect-grid"
            id="defect-grid-${order.id}">
        </div>

    </div>

    `;
}


function initializeDefect(order) {

    const input =
        document.getElementById(
            `defect-input-${order.id}`
        );

    if (!input) return;

    input.addEventListener(
        "change",
        async function() {

            const files =
                Array.from(this.files || []);

            if (!files.length) return;

            await handleDefectFiles(
                order,
                files
            );

            this.value = "";
        }
    );

    renderDefects(order);
}


async function handleDefectFiles(
    order,
    files
) {

    setStatus(
        "正在处理 Defect 图片..."
    );

    for (const file of files) {

        try {

            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image =
                await compressImage(file);

            order.defectItems.push({

                image: image,

                description: ""
            });

        } catch (error) {

            console.error(error);

            alert(
                "图片处理失败：\n" +
                file.name
            );
        }
    }

    renderDefects(order);

    setStatus(
        "Defect 图片处理完成。"
    );
}


function renderDefects(order) {

    const grid =
        document.getElementById(
            `defect-grid-${order.id}`
        );

    if (!grid) return;

    grid.innerHTML = "";

    order.defectItems.forEach(
        (item, index) => {

            const div =
                document.createElement("div");

            div.className =
                "defect-item";

            div.innerHTML = `

                <img
                    src="${item.image.dataURL}"
                    alt="Defect">

                <textarea
                    placeholder="Problem description"
                    oninput="
                        updateDefectDescription(
                            ${order.id},
                            ${index},
                            this.value
                        )
                    "
                >${escapeHTML(
                    item.description
                )}</textarea>

                <button
                    class="danger"
                    onclick="
                        removeDefect(
                            ${order.id},
                            ${index}
                        )
                    ">
                    Delete
                </button>
            `;

            grid.appendChild(div);
        }
    );
}


function updateDefectDescription(
    orderId,
    index,
    value
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.defectItems[
        index
    ].description = value;
}


function removeDefect(
    orderId,
    index
) {

    const order =
        orders.find(
            o => o.id === orderId
        );

    order.defectItems.splice(
        index,
        1
    );

    renderDefects(order);
}


/* =====================================================
   INITIALIZE
   ===================================================== */

function initializeOrder(order) {

    initializeSummary(order);

    initializePackage(order);

    initializeProduct(order);

    initializeDefect(order);
}


/* =====================================================
   PPT HEADER
   ===================================================== */

function addPPTHeader(
    slide,
    order
) {

    const style =
        order.style.trim();

    const orderNumber =
        order.orderNumber.trim();

    const title =
        `${style} ${orderNumber} Mass Production Inspection`;

    slide.addText(
        title,
        {
            x: 0,
            y: 0.2,
            w: 13.333,
            h: 0.4,

            fontFace: "Arial",
            fontSize: 18,

            align: "center",

            margin: 0
        }
    );
}


/* =====================================================
   ADD IMAGE BY HEIGHT
   ===================================================== */

function addImageByHeight(
    slide,
    image,
    x,
    y,
    heightCM
) {

    if (
        !image ||
        !image.width ||
        !image.height
    ) {
        return;
    }

    const h =
        cm(heightCM);

    const ratio =
        image.width /
        image.height;

    const w =
        h * ratio;

    slide.addImage({

        data: image.dataURL,

        x: x,

        y: y,

        w: w,

        h: h
    });
}


/* =====================================================
   CONTAIN IMAGE
   ===================================================== */

function addImageContain(
    slide,
    image,
    x,
    y,
    boxW,
    boxH
) {

    if (
        !image ||
        !image.width ||
        !image.height
    ) {
        return;
    }

    const ratio =
        image.width /
        image.height;

    let w =
        boxW;

    let h =
        w / ratio;

    if (h > boxH) {

        h =
            boxH;

        w =
            h * ratio;
    }

    slide.addImage({

        data: image.dataURL,

        x:
            x + (boxW - w) / 2,

        y:
            y + (boxH - h) / 2,

        w: w,

        h: h
    });
}


/* =====================================================
   SUMMARY SLIDES
   ===================================================== */

function buildSummarySlides(
    pptx,
    order
) {

    const images =
        order.summaryImages;

    if (!images.length) {
        return;
    }

    for (
        let i = 0;
        i < images.length;
        i += 2
    ) {

        const slide =
            pptx.addSlide();

        addPPTHeader(
            slide,
            order
        );

        slide.addText(
            "Summary:",
            {
                x: cm(1),
                y: cm(1.5),

                w: cm(5),
                h: cm(.7),

                fontFace: "Arial",
                fontSize: 18,

                margin: 0
            }
        );

        slide.addText(
            order.summary || "",
            {
                x: cm(1),
                y: cm(2.2),

                w: cm(31),
                h: cm(1.5),

                fontFace: "Arial",
                fontSize: 18,

                margin: 0
            }
        );

        addImageContain(
            slide,
            images[i],

            cm(.8),
            cm(4.0),

            cm(15.5),
            cm(12)
        );

        if (images[i + 1]) {

            addImageContain(
                slide,
                images[i + 1],

                cm(17.0),
                cm(4.0),

                cm(15.5),
                cm(12)
            );
        }
    }
}


/* =====================================================
   PACKAGE SLIDES
   ===================================================== */

function buildPackageSlides(
    pptx,
    order
) {

    order.packagePages.forEach(
        page => {

            const rows =
                page.rows;

            /*
               Maximum 4 rows per PPT page.
            */

            for (
                let start = 0;
                start < rows.length;
                start += 4
            ) {

                const slide =
                    pptx.addSlide();

                addPPTHeader(
                    slide,
                    order
                );

                slide.addText(
                    "Package",
                    {
                        x: cm(1),
                        y: cm(1.25),

                        w: cm(8),
                        h: cm(1),

                        fontFace: "Arial",
                        fontSize: 28,

                        margin: 0
                    }
                );

                const pageRows =
                    rows.slice(
                        start,
                        start + 4
                    );

                pageRows.forEach(
                    (row, rowIndex) => {

                        const y =
                            cm(3.0) +
                            rowIndex *
                            cm(4.0);

                        /*
                           4 images across.
                        */

                        const slotW =
                            cm(7.0);

                        const xPositions = [
                            cm(.5),
                            cm(8.45),
                            cm(16.4),
                            cm(24.35)
                        ];

                        for (
                            let i = 0;
                            i < 4;
                            i++
                        ) {

                            const image =
                                row[i];

                            if (image) {

                                addImageContain(
                                    slide,
                                    image,

                                    xPositions[i],
                                    y,

                                    slotW,
                                    cm(3)
                                );
                            }

                            if (i < 3) {

                                slide.addText(
                                    "→",
                                    {
                                        x:
                                            xPositions[i]
                                            + slotW
                                            + cm(.05),

                                        y:
                                            y
                                            + cm(.9),

                                        w: cm(.5),
                                        h: cm(.5),

                                        fontFace: "Arial",
                                        fontSize: 20,

                                        align: "center",

                                        margin: 0
                                    }
                                );
                            }
                        }
                    }
                );
            }
        }
    );
}


/* =====================================================
   PRODUCT SLIDES
   ===================================================== */

function buildProductSlides(
    pptx,
    order
) {

    const images =
        order.productImages;

    for (
        let i = 0;
        i < images.length;
        i += 6
    ) {

        const slide =
            pptx.addSlide();

        addPPTHeader(
            slide,
            order
        );

        const pageImages =
            images.slice(
                i,
                i + 6
            );

        pageImages.forEach(
            (image, index) => {

                const row =
                    Math.floor(
                        index / 3
                    );

                const col =
                    index % 3;

                const x =
                    cm(.6) +
                    col * cm(10.65);

                const y =
                    cm(1.7) +
                    row * cm(9.0);

                addImageContain(
                    slide,
                    image,

                    x,
                    y,

                    cm(9.7),
                    cm(8)
                );
            }
        );
    }
}


/* =====================================================
   DEFECT SLIDES
   ===================================================== */

function buildDefectSlides(
    pptx,
    order
) {

    const defects =
        order.defectItems;

    for (
        let i = 0;
        i < defects.length;
        i += 3
    ) {

        const slide =
            pptx.addSlide();

        addPPTHeader(
            slide,
            order
        );

        const page =
            defects.slice(
                i,
                i + 3
            );

        page.forEach(
            (item, index) => {

                const y =
                    cm(1.4) +
                    index * cm(8.0);

                addImageContain(
                    slide,
                    item.image,

                    cm(.6),
                    y,

                    cm(12),
                    cm(7)
                );

                slide.addText(
                    item.description || "",
                    {
                        x: cm(13),
                        y: y + cm(1),

                        w: cm(19),
                        h: cm(5),

                        fontFace: "Arial",
                        fontSize: 18,

                        color: "FF0000",

                        margin: 0,

                        valign: "mid"
                    }
                );
            }
        );
    }
}


/* =====================================================
   PPT
   ===================================================== */

function createPPT() {

    const pptx =
        new PptxGenJS();

    pptx.layout =
        "LAYOUT_WIDE";

    pptx.author =
        "Stitch Report";

    pptx.subject =
        "Mass Production Inspection";

    pptx.title =
        "Mass Production Inspection";

    return pptx;
}


/* =====================================================
   FILE NAME
   ===================================================== */

function makeFileName() {

    const names = [];

    orders.forEach(
        order => {

            const style =
                order.style.trim();

            const orderNumber =
                order.orderNumber.trim();

            const name =
                `${style} ${orderNumber}`.trim();

            if (
                name &&
                !names.includes(name)
            ) {
                names.push(name);
            }
        }
    );

    const base =
        names.join(" + ") ||
        "Inspection";

    const date =
        new Date()
            .toISOString()
            .slice(0, 10);

    return (
        `${base} Mass Production Inspection On ${date}.pptx`
    );
}


/* =====================================================
   EXPORT PPT
   ===================================================== */

async function exportPPT() {

    try {

        setStatus(
            "正在生成 PPT，请稍候..."
        );

        const pptx =
            createPPT();

        let validOrders = 0;

        for (
            const order
            of orders
        ) {

            if (
                !order.style.trim() &&
                !order.orderNumber.trim()
            ) {
                continue;
            }

            validOrders++;

            buildSummarySlides(
                pptx,
                order
            );

            buildPackageSlides(
                pptx,
                order
            );

            buildProductSlides(
                pptx,
                order
            );

            buildDefectSlides(
                pptx,
                order
            );
        }

        if (!validOrders) {

            alert(
                "请至少填写一个款式号或订单号。"
            );

            setStatus("Ready.");

            return;
        }

        const fileName =
            makeFileName();

        await pptx.writeFile({
            fileName: fileName
        });

        setStatus(
            "PPT 已生成：\n" +
            fileName
        );

    } catch (error) {

        console.error(error);

        alert(
            "生成 PPT 失败：\n\n" +
            error.message
        );

        setStatus(
            "PPT 生成失败。"
        );
    }
}
