<style>

  background: #333;

  padding: 22px;

.image-list {

.image-item {

  margin-bottom: 10px;

.image-item img {

  border: 1px solid #ddd;

.image-info {
  flex: 1;

}

.image-info small {
  display: block;
  color: #777;
  margin-top: 4px;
}

.package-page {
  border: 1px solid #ddd;

  margin-top: 12px;
  border-radius: 8px;
}

.package-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  overflow-x: auto;
}

.package-slot {
  width: 110px;
  min-width: 110px;
  height: 95px;
  border: 1px dashed #aaa;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: #fafafa;

.package-slot img {

}

.arrow {

  min-width: 24px;
  text-align: center;
}

.product-grid,
.defect-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.product-item {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 8px;
}

.product-item img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #eee;
}

.defect-item {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 8px;
}

.defect-item img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #eee;
}

.defect-item textarea {
  margin-top: 8px;
  color: red;
}

.status {
  margin-top: 12px;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 7px;
  white-space: pre-wrap;
}

.export-area {
  position: sticky;
  bottom: 0;
  background: rgba(245,245,245,.95);
  padding: 12px 0;
  text-align: center;
  z-index: 20;
}

.export-button {
  font-size: 18px;
  padding: 14px 28px;
  background: #16833b;
}

.compression-note {
  font-size: 13px;
  color: #666;
  margin-top: 8px;
}

@media (max-width: 700px) {

  body {
    padding: 10px;
  }

  h1 {
    font-size: 22px;
  }

  .section {
    padding: 12px;
    border-radius: 9px;
  }

  .section-title {
    font-size: 20px;
  }

  button {
    font-size: 14px;
    padding: 9px 12px;
  }

  .product-grid,
  .defect-grid {
    grid-template-columns: 1fr;
  }

  .product-item img,
  .defect-item img {
    height: auto;
    max-height: 260px;
  }

  .package-row {
    padding-bottom: 5px;
  }

  .drop-zone {
    padding: 18px 10px;
  }

  .image-item img {
    width: 70px;
    height: 60px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Stitch Report Generator</h1>

<div id="orders"></div>

<div style="text-align:center;margin:15px 0;">
  <button onclick="addOrder()">＋ Add Order</button>
</div>

<div class="export-area">
  <button class="export-button" onclick="exportPPT()">
    Export PPT
  </button>
</div>

<div id="status" class="status">
Ready.
</div>

</div>

<script>

/* =========================================================
   BASIC SETTINGS
========================================================= */

const IMAGE_MAX_SIDE = 2000;
const IMAGE_START_QUALITY = 0.82;
const IMAGE_MIN_QUALITY = 0.55;
const IMAGE_TARGET_MAX_BYTES = 500 * 1024;

let orders = [];
let orderIdCounter = 1;


/* =========================================================
   UNIT
========================================================= */

function cm(value) {
  return value / 2.54;
}


/* =========================================================
   IMAGE LOADING
========================================================= */

function loadImageFromDataURL(dataURL) {
  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Image loading failed"));

    img.src = dataURL;
  });
}


/* =========================================================
   IMAGE COMPRESSION
   Important: uses already loaded image
========================================================= */

async function compressImage(file) {

  const originalDataURL = await readFileAsDataURL(file);

  const img = await loadImageFromDataURL(originalDataURL);

  let width = img.naturalWidth;
  let height = img.naturalHeight;

  const originalWidth = width;
  const originalHeight = height;

  if (!width || !height) {
    throw new Error("Invalid image dimensions");
  }

  const maxSide = Math.max(width, height);

  if (maxSide > IMAGE_MAX_SIDE) {

    const ratio = IMAGE_MAX_SIDE / maxSide;

    width = Math.round(width * ratio);
    height = Math.round(height * ratio);
  }

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(img, 0, 0, width, height);

  let quality = IMAGE_START_QUALITY;

  let dataURL = canvas.toDataURL("image/jpeg", quality);

  while (
    dataURL.length * 0.75 > IMAGE_TARGET_MAX_BYTES &&
    quality > IMAGE_MIN_QUALITY
  ) {

    quality -= 0.05;

    dataURL = canvas.toDataURL(
      "image/jpeg",
      quality
    );
  }

  const finalImg = await loadImageFromDataURL(dataURL);

  return {
    dataURL,
    img: finalImg,
    width,
    height,
    originalWidth,
    originalHeight,
    originalSize: file.size,
    finalSize: Math.round(dataURL.length * 0.75)
  };
}


function readFileAsDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}


/* =========================================================
   DROP ZONE
========================================================= */

function setupDropZone(zone, input, callback) {

  zone.addEventListener("click", () => {
    input.click();
  });

  zone.addEventListener("dragover", e => {

    e.preventDefault();

    zone.classList.add("dragover");
  });

  zone.addEventListener("dragleave", () => {

    zone.classList.remove("dragover");
  });

  zone.addEventListener("drop", e => {

    e.preventDefault();

    zone.classList.remove("dragover");

    const files = [...e.dataTransfer.files]
      .filter(file => file.type.startsWith("image/"));

    if (files.length) {

      callback(files);
    }
  });

  input.addEventListener("change", e => {

    const files = [...e.target.files];

    if (files.length) {

      callback(files);
    }

    input.value = "";
  });
}
/* =========================================================
   ADD ORDER
========================================================= */

function addOrder() {

  const order = {

    id: orderIdCounter++,

    style: "",

    orderNumber: "",

    summary: "",

    summaryImages: [],

    packagePages: [
      {
        rows: [
          [null, null, null, null]
        ]
      }
    ],

    productImages: [],

    defectItems: []
  };

  orders.push(order);

  renderOrders();
}


/* =========================================================
   DELETE ORDER
========================================================= */

function deleteOrder(id) {

  if (orders.length <= 1) {

    alert("At least one order is required.");

    return;
  }

  orders = orders.filter(order => order.id !== id);

  renderOrders();
}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {

  const container = document.getElementById("orders");

  container.innerHTML = "";

  orders.forEach((order, index) => {

    container.appendChild(
      renderOrder(order, index)
    );
  });
}


/* =========================================================
   RENDER ORDER
========================================================= */

function renderOrder(order, index) {

  const card = document.createElement("div");

  card.className = "order-card";

  card.innerHTML = `

    <div class="order-header">

      <div class="order-title">
        Order ${index + 1}
      </div>

      <button
        class="danger"
        onclick="deleteOrder(${order.id})">
        Delete
      </button>

    </div>

    <label>款式号 / Style Number</label>

    <input
      type="text"
      value="${escapeHTML(order.style)}"
      oninput="updateOrder(${order.id}, 'style', this.value)"
      placeholder="例如 80769">

    <br><br>

    <label>订单号 / Order Number</label>

    <input
      type="text"
      value="${escapeHTML(order.orderNumber)}"
      oninput="updateOrder(${order.id}, 'orderNumber', this.value)"
      placeholder="例如 C10468981">

    <br><br>

    ${summaryHTML(order)}

    ${packageHTML(order)}

    ${productHTML(order)}

    ${defectHTML(order)}

  `;

  setTimeout(() => {

    initializeOrderZones(order);

  }, 0);

  return card;
}


/* =========================================================
   UPDATE ORDER
========================================================= */

function updateOrder(id, field, value) {

  const order = orders.find(o => o.id === id);

  if (order) {

    order[field] = value;
  }
}


/* =========================================================
   SUMMARY
========================================================= */

function summaryHTML(order) {

  return `

  <div class="section">

    <div class="section-title">
      Summary
    </div>

    <label>Summary Content</label>

    <textarea
      oninput="updateOrder(${order.id}, 'summary', this.value)"
      placeholder="Enter summary">${escapeHTML(order.summary)}</textarea>

    <div
      class="drop-zone"
      id="summary-drop-${order.id}">

      Click to select images or drag images here

      <input
        id="summary-input-${order.id}"
        type="file"
        accept="image/*"
        multiple>

    </div>

    <div
      class="image-list"
      id="summary-list-${order.id}">
    </div>

    <div class="compression-note">
      手机照片会在本地自动压缩，原始照片不会被修改。
    </div>

  </div>

  `;
}


function initializeSummaryZone(order) {

  const zone =
    document.getElementById(`summary-drop-${order.id}`);

  const input =
    document.getElementById(`summary-input-${order.id}`);

  if (!zone || !input) return;

  setupDropZone(
    zone,
    input,
    files => handleSummaryFiles(order, files)
  );

  renderSummary(order);
}


async function handleSummaryFiles(order, files) {

  setStatus("正在处理 Summary 图片...");

  for (const file of files) {

    try {

      const image = await compressImage(file);

      order.summaryImages.push(image);

    } catch (error) {

      console.error(error);

      alert(`无法处理图片：${file.name}`);
    }
  }

  renderSummary(order);

  setStatus("Summary 图片处理完成。");
}


function renderSummary(order) {

  const list =
    document.getElementById(`summary-list-${order.id}`);

  if (!list) return;

  list.innerHTML = "";

  order.summaryImages.forEach((item, index) => {

    const div = document.createElement("div");

    div.className = "image-item";

    div.innerHTML = `

      <img src="${item.dataURL}">

      <div class="image-info">

        Image ${index + 1}

        <small>
          ${item.width} × ${item.height}px
          · ${formatBytes(item.finalSize)}
        </small>

      </div>

      <button
        class="danger"
        onclick="removeSummaryImage(${order.id}, ${index})">
        Delete
      </button>
    `;

    list.appendChild(div);
  });
}


function removeSummaryImage(orderId, index) {

  const order =
    orders.find(o => o.id === orderId);

  order.summaryImages.splice(index, 1);

  renderSummary(order);
}


/* =========================================================
   PACKAGE
========================================================= */

function packageHTML(order) {

  return `

  <div class="section">

    <div class="section-title">
      Package
    </div>

    <div
      class="drop-zone"
      id="package-drop-${order.id}">

      Click to select package images or drag images here

      <input
        id="package-input-${order.id}"
        type="file"
        accept="image/*"
        multiple>

    </div>

    <div id="package-pages-${order.id}">
    </div>

    <button onclick="addPackagePage(${order.id})">
      ＋ Add Package Page
    </button>

  </div>

  `;
}


function initializePackageZone(order) {

  const zone =
    document.getElementById(`package-drop-${order.id}`);

  const input =
    document.getElementById(`package-input-${order.id}`);

  if (!zone || !input) return;

  setupDropZone(
    zone,
    input,
    files => handlePackageFiles(order, files)
  );

  renderPackage(order);
}


async function handlePackageFiles(order, files) {

  setStatus("正在处理 Package 图片...");

  for (const file of files) {

    try {

      const image = await compressImage(file);

      let placed = false;

      for (const page of order.packagePages) {

        for (const row of page.rows) {

          for (let i = 0; i < 4; i++) {

            if (!row[i]) {

              row[i] = image;

              placed = true;

              break;
            }
          }

          if (placed) break;
        }

        if (placed) break;
      }

      if (!placed) {

        order.packagePages.push({
          rows: [
            [image, null, null, null]
          ]
        });
      }

    } catch (error) {

      console.error(error);

      alert(`无法处理图片：${file.name}`);
    }
  }

  renderPackage(order);

  setStatus("Package 图片处理完成。");
}


function renderPackage(order) {

  const container =
    document.getElementById(`package-pages-${order.id}`);

  if (!container) return;

  container.innerHTML = "";

  order.packagePages.forEach(
    (page, pageIndex) => {

      const pageDiv =
        document.createElement("div");

      pageDiv.className = "package-page";

      pageDiv.innerHTML =
        `<strong>Package Page ${pageIndex + 1}</strong>`;

      page.rows.forEach(
        (row, rowIndex) => {

          const rowDiv =
            document.createElement("div");

          rowDiv.className = "package-row";

          for (let i = 0; i < 4; i++) {

            const slot =
              document.createElement("div");

            slot.className = "package-slot";

            if (row[i]) {

              slot.innerHTML = `

                <img src="${row[i].dataURL}">

                <button
                  class="danger"
                  style="position:absolute;"
                  onclick="removePackageImage(
                    ${order.id},
                    ${pageIndex},
                    ${rowIndex},
                    ${i}
                  )">
                  ×
                </button>

              `;
            }

            rowDiv.appendChild(slot);

            if (i < 3) {

              const arrow =
                document.createElement("div");

              arrow.className = "arrow";

              arrow.textContent = "→";

              rowDiv.appendChild(arrow);
            }
          }

          pageDiv.appendChild(rowDiv);

        }
      );

      const addRowButton =
        document.createElement("button");

      addRowButton.textContent =
        "＋ Add Row";

      addRowButton.onclick =
        () => addPackageRow(
          order.id,
          pageIndex
        );

      pageDiv.appendChild(addRowButton);

      container.appendChild(pageDiv);
    }
  );
}


function addPackageRow(orderId, pageIndex) {

  const order =
    orders.find(o => o.id === orderId);

  order.packagePages[pageIndex].rows.push(
    [null, null, null, null]
  );

  renderPackage(order);
}


function addPackagePage(orderId) {

  const order =
    orders.find(o => o.id === orderId);

  order.packagePages.push({

    rows: [
      [null, null, null, null]
    ]

  });

  renderPackage(order);
}


function removePackageImage(
  orderId,
  pageIndex,
  rowIndex,
  slotIndex
) {

  const order =
    orders.find(o => o.id === orderId);

  order.packagePages[pageIndex]
    .rows[rowIndex][slotIndex] = null;

  renderPackage(order);
}


/* =========================================================
   PRODUCT PHOTO
========================================================= */

function productHTML(order) {

  return `

  <div class="section">

    <div class="section-title">
      Product Photo
    </div>

    <div
      class="drop-zone"
      id="product-drop-${order.id}">

      Click to select product photos or drag photos here

      <input
        id="product-input-${order.id}"
        type="file"
        accept="image/*"
        multiple>

    </div>

    <div
      class="product-grid"
      id="product-grid-${order.id}">
    </div>

  </div>

  `;
}


function initializeProductZone(order) {

  const zone =
    document.getElementById(`product-drop-${order.id}`);

  const input =
    document.getElementById(`product-input-${order.id}`);

  if (!zone || !input) return;

  setupDropZone(
    zone,
    input,
    files => handleProductFiles(order, files)
  );

  renderProducts(order);
}


async function handleProductFiles(order, files) {

  setStatus("正在处理 Product Photo...");

  for (const file of files) {

    try {

      const image = await compressImage(file);

      order.productImages.push(image);

    } catch (error) {

      console.error(error);

      alert(`无法处理图片：${file.name}`);
    }
  }

  renderProducts(order);

  setStatus("Product Photo 处理完成。");
}


function renderProducts(order) {

  const grid =
    document.getElementById(`product-grid-${order.id}`);

  if (!grid) return;

  grid.innerHTML = "";

  order.productImages.forEach(
    (item, index) => {

      const div =
        document.createElement("div");

      div.className = "product-item";

      div.innerHTML = `

        <img src="${item.dataURL}">

        <div style="font-size:13px;margin-top:5px;">
          Product ${index + 1}
        </div>

        <button
          class="danger"
          onclick="removeProductImage(
            ${order.id},
            ${index}
          )">
          Delete
        </button>

      `;

      grid.appendChild(div);
    }
  );
}


function removeProductImage(orderId, index) {

  const order =
    orders.find(o => o.id === orderId);

  order.productImages.splice(index, 1);

  renderProducts(order);
}


/* =========================================================
   DEFECT
========================================================= */

function defectHTML(order) {

  return `

  <div class="section">

    <div class="section-title">
      Defect
    </div>

    <div
      class="drop-zone"
      id="defect-drop-${order.id}">

      Click to select defect photos or drag photos here

      <input
        id="defect-input-${order.id}"
        type="file"
        accept="image/*"
        multiple>

    </div>

    <div
      class="defect-grid"
      id="defect-grid-${order.id}">
    </div>

  </div>

  `;
}


function initializeDefectZone(order) {

  const zone =
    document.getElementById(`defect-drop-${order.id}`);

  const input =
    document.getElementById(`defect-input-${order.id}`);

  if (!zone || !input) return;

  setupDropZone(
    zone,
    input,
    files => handleDefectFiles(order, files)
  );

  renderDefects(order);
}


async function handleDefectFiles(order, files) {

  setStatus("正在处理 Defect 图片...");

  for (const file of files) {

    try {

      const image = await compressImage(file);

      order.defectItems.push({

        image,

        description: ""

      });

    } catch (error) {

      console.error(error);

      alert(`无法处理图片：${file.name}`);
    }
  }

  renderDefects(order);

  setStatus("Defect 图片处理完成。");
}


function renderDefects(order) {

  const grid =
    document.getElementById(`defect-grid-${order.id}`);

  if (!grid) return;

  grid.innerHTML = "";

  order.defectItems.forEach(
    (item, index) => {

      const div =
        document.createElement("div");

      div.className = "defect-item";

      div.innerHTML = `

        <img src="${item.image.dataURL}">

        <textarea
          placeholder="Problem description"
          oninput="
            updateDefectDescription(
              ${order.id},
              ${index},
              this.value
            )
          ">${escapeHTML(item.description)}</textarea>

        <button
          class="danger"
          onclick="
            removeDefect(
              ${order.id},
              ${index}
            )
          ">
          Delete
        </button>

      `;

      grid.appendChild(div);
    }
  );
}


function updateDefectDescription(
  orderId,
  index,
  value
) {

  const order =
    orders.find(o => o.id === orderId);

  order.defectItems[index].description =
    value;
}


function removeDefect(orderId, index) {

  const order =
    orders.find(o => o.id === orderId);

  order.defectItems.splice(index, 1);

  renderDefects(order);
}


/* =========================================================
   INITIALIZE ALL ORDER ZONES
========================================================= */

function initializeOrderZones(order) {

  initializeSummaryZone(order);

  initializePackageZone(order);

  initializeProductZone(order);

  initializeDefectZone(order);
}


/* =========================================================
   PPT HEADER
========================================================= */

function addPPTHeader(slide, order) {

  const style =
    order.style.trim();

  const orderNumber =
    order.orderNumber.trim();

  const title =
    `${style} ${orderNumber} Mass Production Inspection`;

  slide.addText(
    title,
    {
      x: 0,
      y: 0.2,
      w: 13.333,
      h: 0.4,
      fontFace: "Arial",
      fontSize: 18,
      bold: false,
      align: "center",
      margin: 0
    }
  );
}


/* =========================================================
   IMAGE ADD
========================================================= */

function addImageByHeight(
  slide,
  image,
  x,
  y,
  heightCM
) {

  const h =
    cm(heightCM);

  const ratio =
    image.width / image.height;

  const w =
    h * ratio;

  slide.addImage({

    data: image.dataURL,

    x,

    y,

    w,

    h

  });
}


/* =========================================================
   CONTAIN IMAGE
========================================================= */

function addImageContain(
  slide,
  image,
  x,
  y,
  boxW,
  boxH
) {

  const ratio =
    image.width / image.height;

  let w =
    boxW;

  let h =
    w / ratio;

  if (h > boxH) {

    h = boxH;

    w = h * ratio;
  }

  slide.addImage({

    data: image.dataURL,

    x: x + (boxW - w) / 2,

    y: y + (boxH - h) / 2,

    w,

    h

  });
}


/* =========================================================
   SUMMARY SLIDES
========================================================= */

function buildSummarySlides(pptx, order) {

  const images =
    order.summaryImages;

  if (!images.length) return;

  for (
    let i = 0;
    i < images.length;
    i += 2
  ) {

    const slide =
      pptx.addSlide();

    addPPTHeader(slide, order);

    slide.addText(
      "Summary:",
      {
        x: cm(1),
        y: cm(1.6),
        w: cm(5),
        h: cm(.7),
        fontFace: "Arial",
        fontSize: 18,
        margin: 0
      }
    );

    slide.addText(
      order.summary || "",
      {
        x: cm(1),
        y: cm(2.3),
        w: cm(30),
        h: cm(2),
        fontFace: "Arial",
        fontSize: 18,
        margin: 0,
        breakLine: false
      }
    );

    const img1 = images[i];

    addImageContain(
      slide,
      img1,
      cm(1),
      cm(4.4),
      cm(15.2),
      cm(12)
    );

    if (images[i + 1]) {

      addImageContain(
        slide,
        images[i + 1],
        cm(17),
        cm(4.4),
        cm(15.2),
        cm(12)
      );
    }
  }
}


/* =========================================================
   PACKAGE SLIDES
========================================================= */

function buildPackageSlides(pptx, order) {

  order.packagePages.forEach(page => {

    const rows =
      page.rows;

    for (
      let start = 0;
      start < rows.length;
      start += 4
    ) {

      const slide =
        pptx.addSlide();

      addPPTHeader(slide, order);

      slide.addText(
        "Package",
        {
          x: cm(1),
          y: cm(1.3),
          w: cm(8),
          h: cm(1),
          fontFace: "Arial",
          fontSize: 28,
          margin: 0
        }
      );

      const pageRows =
        rows.slice(start, start + 4);

      pageRows.forEach(
        (row, rowIndex) => {

          const y =
            cm(3.2) +
            rowIndex * cm(4.0);

          const slotW =
            cm(7.1);

          for (let i = 0; i < 4; i++) {

            const image =
              row[i];

            const x =
              cm(.6) +
              i * cm(7.9);

            if (image) {

              addImageContain(
                slide,
                image,
                x,
                y,
                slotW,
                cm(3)
              );
            }

            if (i < 3) {

              slide.addText(
                "→",
                {
                  x:
                    x + slotW + cm(.1),

                  y:
                    y + cm(.9),

                  w: cm(.6),

                  h: cm(.6),

                  fontFace: "Arial",

                  fontSize: 20,

                  align: "center",

                  margin: 0
                }
              );
            }
          }
        }
      );
    }
  });
}


/* =========================================================
   PRODUCT SLIDES
========================================================= */

function buildProductSlides(pptx, order) {

  const images =
    order.productImages;

  for (
    let i = 0;
    i < images.length;
    i += 6
  ) {

    const slide =
      pptx.addSlide();

    addPPTHeader(slide, order);

    const pageImages =
      images.slice(i, i + 6);

    pageImages.forEach(
      (image, index) => {

        const row =
          Math.floor(index / 3);

        const col =
          index % 3;

        const x =
          cm(.7) +
          col * cm(10.6);

        const y =
          cm(2) +
          row * cm(9.0);

        addImageContain(
          slide,
          image,
          x,
          y,
          cm(9.5),
          cm(8)
        );
      }
    );
  }
}


/* =========================================================
   DEFECT SLIDES
========================================================= */

function buildDefectSlides(pptx, order) {

  const defects =
    order.defectItems;

  for (
    let i = 0;
    i < defects.length;
    i += 3
  ) {

    const slide =
      pptx.addSlide();

    addPPTHeader(slide, order);

    const page =
      defects.slice(i, i + 3);

    page.forEach(
      (item, index) => {

        const y =
          cm(1.5) +
          index * cm(8.0);

        addImageContain(
          slide,
          item.image,
          cm(.7),
          y,
          cm(12),
          cm(7)
        );

        slide.addText(
          item.description || "",
          {
            x: cm(13),
            y: y + cm(1),
            w: cm(19),
            h: cm(5),
            fontFace: "Arial",
            fontSize: 18,
            color: "FF0000",
            margin: 0,
            valign: "mid"
          }
        );
      }
    );
  }
}


/* =========================================================
   CREATE PPT
========================================================= */

function createPPT() {

  const pptx =
    new PptxGenJS();

  pptx.layout =
    "LAYOUT_WIDE";

  pptx.author =
    "Stitch Report Generator";

  pptx.subject =
    "Mass Production Inspection";

  pptx.title =
    "Mass Production Inspection";

  pptx.company =
    "Stitch";

  return pptx;
}


/* =========================================================
   EXPORT
========================================================= */

async function exportPPT() {

  try {

    setStatus(
      "正在生成 PPT，请稍候..."
    );

    const pptx =
      createPPT();

    let validOrderCount = 0;

    for (const order of orders) {

      if (
        !order.style.trim() &&
        !order.orderNumber.trim()
      ) {

        continue;
      }

      validOrderCount++;

      buildSummarySlides(
        pptx,
        order
      );

      buildPackageSlides(
        pptx,
        order
      );

      buildProductSlides(
        pptx,
        order
      );

      buildDefectSlides(
        pptx,
        order
      );
    }

    if (!validOrderCount) {

      alert(
        "请至少填写一个款式号或订单号。"
      );

      setStatus("Ready.");

      return;
    }

    const fileName =
      makeFileName();

    await pptx.writeFile({
      fileName
    });

    setStatus(
      `PPT 已生成：\n${fileName}`
    );

  } catch (error) {

    console.error(error);

    alert(
      "生成 PPT 时出现错误：\n" +
      error.message
    );

    setStatus(
      "生成失败，请打开浏览器控制台查看错误。"
    );
  }
}


/* =========================================================
   FILE NAME
========================================================= */

function makeFileName() {

  const bases = [];

  orders.forEach(order => {

    const style =
      order.style.trim();

    const orderNumber =
      order.orderNumber.trim();

    const base =
      `${style} ${orderNumber}`.trim();

    if (
      base &&
      !bases.includes(base)
    ) {

      bases.push(base);
    }
  });

  const baseName =
    bases.join(" + ") ||
    "Inspection";

  const today =
    new Date()
      .toISOString()
      .slice(0, 10);

  return (
    `${baseName} Mass Production Inspection On ${today}.pptx`
  );
}


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text) {

  const status =
    document.getElementById("status");

  if (status) {

    status.textContent =
      text;
  }
}


function formatBytes(bytes) {

  if (bytes < 1024) {

    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );
  }

  return (
    (bytes / 1024 / 1024).toFixed(2) +
    " MB"
  );
}


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
